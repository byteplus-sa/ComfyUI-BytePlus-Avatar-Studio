name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  studio:
    name: Studio checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install test tools
        run: python -m pip install aiohttp Pillow numpy av ruff==0.17.1 mypy==2.4.1 comfy-cli==1.22.0
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Verify backend
        run: |
          python -m unittest discover -s tests -v
          ruff check .
          mypy -p avatar_studio
          python -m compileall -q avatar_studio __init__.py
      - name: Verify frontend
        run: |
          npm --prefix frontend run test
          npm --prefix frontend run lint
          npm --prefix frontend run typecheck
          npm --prefix frontend run build
          git diff --exit-code -- studio_dist
          npm --prefix frontend audit --audit-level=moderate
          node --check web/extension.js
      - name: Install test browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run offline browser checks
        run: npm --prefix frontend run test:e2e
      - name: Validate Registry package
        run: |
          comfy --skip-prompt --no-enable-telemetry node validate
          comfy --skip-prompt --no-enable-telemetry node pack
          python scripts/check_registry_package.py node.zip

  native:
    name: Native ComfyUI ${{ matrix.comfyui }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        comfyui: ["v0.31.0", "v0.46.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: studio
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Comfy-Org/ComfyUI
          ref: ${{ matrix.comfyui }}
          path: core
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: byteplus-sa/ComfyUI-BytePlus-ModelArk
          ref: c0ffd24f62bbe11697c7b96a1a398f3e129a3d20
          path: companion
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install native dependencies
        run: |
          python -m pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r core/requirements.txt -r companion/requirements.txt
      - name: Validate all native workflow variants without generation
        working-directory: studio
        env:
          PYTHONPATH: .
          PYTHONDONTWRITEBYTECODE: "1"
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: python tests/native_contracts.py --comfy-root ../core --companion-root ../companion
